<h2>E-Mail-Adresse bestätigen</h2>
<p>Bitte bestätige die E-Mail-Adresse deines Barrechner-Kontos. Der Link funktioniert auf jedem Gerät.</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email&next=/dashboard&verify_email=1">E-Mail-Adresse bestätigen</a></p>
<p>Falls du kein Konto erstellt hast, kannst du diese E-Mail ignorieren.</p>
