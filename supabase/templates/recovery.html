<h2>Passwort zurücksetzen</h2>
<p>Mit diesem Link legst du ein neues Passwort für dein Barrechner-Konto fest. Er funktioniert auf jedem Gerät.</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/passwort-neu&verify_email=1">Neues Passwort festlegen</a></p>
<p>Falls du das nicht angefordert hast, kannst du diese E-Mail ignorieren.</p>
